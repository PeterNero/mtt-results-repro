[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtt-results-repro"
version = "0.1.0"
description = "Self-contained reproduction of MTT matrices, values, spectra, and numerical claims"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6",
  "rundec==0.7",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["tools*"]
